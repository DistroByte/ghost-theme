name: Deploy Theme

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Mirrors test.yml: upstream builds with pnpm on Node 26
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build theme
        run: |
          pnpm zip

      - name: Upload to ghost
        env:
          KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          SITE_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
        run: |
          ./upload.sh

      # notify discord
      - name: Notify Discord
        run: |
          curl -H "Content-Type: application/json" -d \
            '{"content": "## New ghost theme uploaded\n\n**Version**: '"$(cat package.json | jq -r '.version')"'\n\n[View site](https://photo.james-hackett.ie)"}' \
            ${{ secrets.DISCORD_WEBHOOK }}
